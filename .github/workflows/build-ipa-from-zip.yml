name: Build BreakoutRadar IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Unzip project
        run: |
          rm -rf BreakoutRadar-iOS
          unzip -q BreakoutRadar-iOS.zip
          test -f BreakoutRadar-iOS/BreakoutRadar.xcodeproj/project.pbxproj

      - name: Build iPhone app without signing
        working-directory: BreakoutRadar-iOS
        run: |
          xcodebuild \
            -project BreakoutRadar.xcodeproj \
            -scheme BreakoutRadar \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package IPA
        working-directory: BreakoutRadar-iOS
        run: |
          rm -rf Payload BreakoutRadar-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BreakoutRadar.app Payload/
          zip -qry BreakoutRadar-unsigned.ipa Payload
          test -f BreakoutRadar-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BreakoutRadar-unsigned-ipa
          path: BreakoutRadar-iOS/BreakoutRadar-unsigned.ipa
          if-no-files-found: error
